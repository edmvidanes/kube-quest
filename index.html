function deployment(name='web',image='cloudline:v1',replicas=2,ns='default'){return {apiVersion:'apps/v1',kind:'Deployment',metadata:{name,namespace:ns},spec:{replicas,selector:{matchLabels:{app:name}},strategy:{type:'RollingUpdate',rollingUpdate:{maxSurge:1,maxUnavailable:0}},template:{metadata:{labels:{app:name}},spec:{containers:[{name:'app',image,ports:[{containerPort:80}],resources:{requests:{cpu:'100m',memory:'128Mi'}},readinessProbe:{httpGet:{path:'/ready',port:80}}}]}}}};}
function service(name='web',selector={app:'web'},ns='default',port=80,targetPort=80,type='ClusterIP'){return {apiVersion:'v1',kind:'Service',metadata:{name,namespace:ns},spec:{type,selector,ports:[{port,targetPort}]}};}
function ingress(path='/'){return {apiVersion:'networking.k8s.io/v1',kind:'Ingress',metadata:{name:'shop'},spec:{ingressClassName:'cloudline',rules:[{host:'shop.cloudline.test',http:{paths:[{path,pathType:'Prefix',backend:{service:{name:'web',port:{number:80}}}}]}}]}};}
function hpa(name='web',ns='default',min=2,max=6,target=60){return {apiVersion:'autoscaling/v2',kind:'HorizontalPodAutoscaler',metadata:{name,namespace:ns},spec:{scaleTargetRef:{apiVersion:'apps/v1',kind:'Deployment',name},minReplicas:min,maxReplicas:max,metrics:[{type:'Resource',resource:{name:'cpu',target:{type:'Utilization',averageUtilization:target}}}]}};}
const regions=[{name:'Launch Bay',tag:'01 / FOUNDATIONS',color:'#45d4cb',badge:'Launch operator',description:'From a missing workload to a resilient fleet.'},{name:'Connection District',tag:'02 / DISCOVERY',color:'#76aaff',badge:'Network navigator',description:'Follow the request. Repair the connections.'},{name:'Release Workshop',tag:'03 / DELIVERY',color:'#d3a3ff',badge:'Release engineer',description:'Ship safely. Protect the data that matters.'},{name:'Reliability Ridge',tag:'04 / OPERATIONS',color:'#ffba76',badge:'Cloud guardian',description:'Find capacity. Recover. Keep the cloud running.'}];

const missions=[
 [1,'The vanished storefront','Mira · Retail team','The retail team says its application has vanished. The default namespace looks empty. Find the workload before deploying another copy.','Namespaces group resources; an empty list does not mean an empty cluster.','The Pods were in storefront, not default. kubectl talks to the API server; worker nodes run containers. A namespace organizes resources and names, but is not a network firewall.',[action('Search all namespaces','kubectl get pods -A'),action('Inspect storefront','kubectl get pods -n storefront'),action('Meet the worker nodes','kubectl get nodes')]],
 [2,'Send the first signal','Ivo · Weather station','A weather station needs a simple beacon online. Submit the supplied Pod manifest, then follow its journey from accepted to Ready.','An API object must be scheduled and started before it can serve.','The API persisted your request, the scheduler bound the Pod to a worker, and kubelet asked the container runtime to start it. A bare Pod has no controller to recreate it if deleted.',[action('Launch beacon','kubectl apply -f beacon.yaml'),action('Inspect the beacon','kubectl describe pod beacon')]],
 [3,'Give it a safety net','Nia · Status service','A single manually created beacon is too fragile. Replace it with a two-replica web Deployment and verify that a ReplicaSet owns the new Pods.','Deployment → ReplicaSet → Pods is an ownership chain.','The Deployment created a ReplicaSet. That ReplicaSet requests Pods until its desired count is reached. The scheduler only places Pod objects; it does not place Deployments.',[action('Create the Deployment','kubectl apply -f web.yaml'),action('Remove the bare beacon','kubectl delete pod beacon'),action('Inspect ownership','kubectl get replicasets')]],
 [4,'A missing replica','Sol · Messaging team','The messaging team wants proof of self-healing. Delete one managed web Pod and watch its ReplicaSet restore two Ready replicas.','Controllers reconcile observed state with desired state.','Deleting the Pod did not change the replica target. The ReplicaSet created a new Pod with a different UID. It was a replacement, not the original Pod returning.',[action('Delete one managed Pod','kubectl delete pod $pod'),action('Inspect the replica gap','kubectl get pods')]],
 [5,'The morning rush','Ari · Ticket desk','Three service replicas are needed for the morning opening. Scale web to three, wait for Ready backends, and test the public shop route.','Scaling changes a replica target, then controllers close the gap.','Scaling updated the Deployment spec. Its existing ReplicaSet created another Pod; scaling alone did not create a new application revision.',[action('Set replica target','kubectl scale deployment web --replicas=$replicas',[{name:'replicas',label:'Desired replicas',value:'2'}]),action('Test the storefront','curl http://shop.cloudline.test/')]],
 [6,'Nobody answers','Jules · Support desk','The web Pods are Ready, but customers receive no response. Inspect the Service selector and compare it with the Pod labels.','Services select Pods by labels in the same namespace.','The selector pointed at the wrong app label. Correcting it let the EndpointSlice controller publish Ready backends; network rules can now forward traffic.',[action('Inspect Pod labels','kubectl get pods --show-labels'),edit('Update Service selector','service.yaml','spec.selector.app','other','app label to match'),action('Test the storefront','curl http://shop.cloudline.test/')]],
 [7,'A name in the wrong neighborhood','Bea · Inventory team','A client in default cannot resolve web, which runs in storefront. Reach it using its namespace-qualified DNS name.','Short Service names resolve in the client Pod’s namespace.','web.storefront.svc.cluster.local identifies a Service in storefront. DNS resolves the Service address, then the data plane selects a backend. Namespaces alone do not prohibit this connection.',[action('Find the Service','kubectl get services -A'),action('Request from the client','kubectl exec client -- curl $url',[{name:'url',label:'Internal HTTP URL',value:'http://web'}])]],
 [8,'The gate is closed','Ren · Shipping team','The web Service works internally. Its Ingress accepts the wrong path, so customers cannot open the shop homepage. Repair the route.','Ingress configuration needs a controller to implement it.','Your Ingress route now matches the host and path. A supplied Ingress controller handles HTTP and forwards to the Service. Creating an Ingress alone would not install that controller.',[action('Inspect the gate','kubectl describe ingress shop'),edit('Update HTTP path','ingress.yaml','spec.rules.0.http.paths.0.path','/staff','Path prefix'),action('Test the homepage','curl http://shop.cloudline.test/')]],
 [9,'Stuck in maintenance','Elle · Newsroom','The newsroom is healthy but reports maintenance mode. Set APP_MODE to production in its ConfigMap, then restart the Deployment so new containers receive the value.','Environment configuration is captured when a container starts.','Changing a ConfigMap does not rewrite environment variables in existing containers. A rolling restart created new Pods that read the updated configuration at startup.',[edit('Update application mode','config.yaml','data.APP_MODE','maintenance','APP_MODE'),action('Restart to read configuration','kubectl rollout restart deployment/web'),action('Test the newsroom','curl http://shop.cloudline.test/')]],
 [10,'Credentials, delivered','Kai · Payment sandbox','The payment sandbox needs a fictional API_TOKEN. Create the Secret with training-token, restart the workload, and check its response. Never enter a real credential here.','Secrets separate configuration references from application images.','New containers resolved secretKeyRef at startup. Secret data uses base64 representation, which is not encryption. This browser simulator stores only fictional training values.',[edit('Create training credential','secret.yaml','stringData.API_TOKEN','','Fictional API_TOKEN'),action('Restart the application','kubectl rollout restart deployment/web'),action('Test payment sandbox','curl http://shop.cloudline.test/')]],
 [11,'Running, but not ready','Dev · Search team','The search container is Running, but its readiness check asks for a nonexistent path. Repair the readiness path and keep the valid liveness check.','Readiness controls routing; liveness controls container restart.','The repaired readiness check let the Pod receive traffic. A readiness failure keeps a running container out of Service backends; a liveness failure restarts a container inside the same Pod.',[action('Read health-check evidence','kubectl get pods'),edit('Repair readiness path','web.yaml','spec.template.spec.containers.0.readinessProbe.httpGet.path','/missing','Readiness HTTP path'),action('Test search','curl http://shop.cloudline.test/')]],
 [12,'A release without silence','Uma · Transit team','Transit needs cloudline:v2 with two Ready replicas. Change the image and watch old and new ReplicaSets overlap within the rollout budget.','RollingUpdate progressively replaces Pods using a new template.','The new Pod template created a new ReplicaSet. With maxSurge 1 and maxUnavailable 0, new Ready capacity came online before an old Ready Pod was removed.',[action('Update the container image','kubectl set image deployment/web app=$image',[{name:'image',label:'Image tag',value:'cloudline:v1'}]),action('Check rollout','kubectl rollout status deployment/web'),action('Test transit','curl http://shop.cloudline.test/')]],
 [13,'The version that never arrived','Finn · Media team','An image typo stalled the release. Inspect rollout history, then deliberately restore the earlier working revision.','A failed rollout does not automatically roll back.','The nonexistent image could not start. Kubernetes reported the stalled release while the available old replicas remained. Your explicit rollback restored the earlier Pod template.',[action('Read release history','kubectl rollout history deployment/web'),action('Inspect rollout failure','kubectl rollout status deployment/web'),action('Restore the previous revision','kubectl rollout undo deployment/web'),action('Verify the media app','curl http://shop.cloudline.test/')]],
 [14,'Orders that must survive','Tess · Fulfilment team','Orders live on supplied PV orders-disk. Bind a PVC called orders, mount it in web instead of emptyDir, replace a Pod, and read the saved order.','A PVC requests storage; the PV lifecycle is independent of a Pod.','The bound PVC points to supplied persistent storage. The replacement Pod reads the same order. emptyDir belongs to one Pod and disappears when that Pod is deleted.',[action('Request supplied storage','kubectl apply -f storage.yaml'),{label:'Mount the orders claim',file:'web.yaml',special:'volume',fields:[{name:'value',label:'PVC name',value:'orders'}]},action('Replace a web Pod','kubectl delete pod $pod'),action('Read saved orders','kubectl exec $pod -- cat /data/orders.txt')]],
 [15,'Finish the night shift','Oli · Archive team','The archive needs a one-off maintenance task. Apply the Job manifest and check that its Pod finishes rather than staying online indefinitely.','A Job reconciles successful completion, not continuous availability.','The Job controller created a task Pod and recorded successful completion when its container exited. A CronJob would create Jobs on a schedule; scheduling is described in the guide.',[action('Launch maintenance Job','kubectl apply -f job.yaml'),action('Inspect task completion','kubectl get jobs')]],
 [16,'No room at the inn','Sana · Analytics team','The analytics Pods request more CPU than any worker has. Inspect Pending evidence and reduce the request to 500m per Pod without changing its separate limits.','Scheduling uses resource requests, not current usage or limits.','The scheduler found capacity after the Pod template requested 500m. Requests reserve scheduling capacity. CPU limits cap execution; memory limits can cause OOM termination.',[action('Inspect capacity','kubectl get nodes'),action('Inspect Pending Pods','kubectl get pods'),edit('Right-size CPU request','web.yaml','spec.template.spec.containers.0.resources.requests.cpu','3000m','CPU request'),action('Test analytics','curl http://shop.cloudline.test/')]],
 [17,'The reserved worker','Max · Image lab','The image lab belongs on the gpu pool. Fix its node selector and tolerate dedicated=vip:NoSchedule on the reserved worker.','Selectors narrow placement; tolerations allow a tainted node.','The node selector selected the gpu pool, and the toleration allowed its NoSchedule taint. A toleration alone would not force placement on that node.',[edit('Choose the worker pool','web.yaml','spec.template.spec.nodeSelector.pool','accelerator','Required pool label'),{label:'Add the matching toleration',file:'web.yaml',special:'toleration',fields:[{name:'value',label:'dedicated taint value',value:''}]},action('Inspect placement','kubectl get pods -o wide')]],
 [18,'When the crowd grows','Luz · Festival team','Festival demand is 240m CPU across the application. Each Pod requests 100m. Configure an HPA targeting 60% utilization, with 2–6 replicas, then verify four Ready replicas.','CPU utilization compares usage to requests; HPA changes Deployment replicas.','The teaching calculation recommends ceil(240 / (100 × 0.6)) = 4 replicas. The HPA changed the Deployment target; normal controllers and the scheduler did the rest.',[action('Inspect simulated metrics','kubectl top pods'),action('Configure autoscaling','kubectl autoscale deployment web --min=2 --max=6 --cpu-percent=$target',[{name:'target',label:'Target CPU utilization (%)',value:'60'}]),action('Inspect the HPA','kubectl get hpa'),action('Test the festival app','curl http://shop.cloudline.test/')]],

const guides=[
 ['Mental model','Control plane and worker nodes','kubectl → API server → persisted state. Controllers watch the API and reconcile it. The scheduler binds Pods; kubelet and the container runtime start them. etcd stores API data. The supplied CNI provides Pod networking.','kubectl get nodes\nkubectl describe node worker-a'],
 ['Workloads','Pods, Deployments, ReplicaSets','A Pod is the smallest scheduled unit and can contain containers; this teaching engine models one application container. A Deployment manages ReplicaSets, which request the desired number of Pods. A deleted managed Pod is replaced with a new UID.','kubectl run beacon --image=cloudline:v1\nkubectl create deployment web --image=cloudline:v1\nkubectl get rs\nkubectl scale deployment web --replicas=3'],
 ['Discovery','Namespaces, labels and selectors','Names are scoped to namespaces. A short Service DNS name resolves in the client namespace. Services match Pod labels within their namespace; a Pod name is not its routing selector. Namespaces do not create network isolation by themselves.','kubectl get pods -A\nkubectl get pods -n storefront --show-labels\nkubectl get pods -l app=web\nkubectl label pod NAME app=web --overwrite'],
 ['Networking','Service, EndpointSlice and DNS','ClusterIP is internal. NodePort exposes a worker port; LoadBalancer uses a preconfigured simulated external address. EndpointSlices hold ready backend identities. kube-proxy implements Service network rules in this model; application packets do not flow through the control plane.','kubectl expose deployment web --port=80 --target-port=80\nkubectl get endpointslices\nkubectl exec client -- curl http://web.storefront.svc.cluster.local'],
 ['Networking','Ingress and customer requests','Ingress routes a host and HTTP path through an Ingress controller to a Service. The controller is supplied here, and is a separate installation in real clusters. Use / for the shop homepage. Only HTTP requests and Prefix routes are modeled.','kubectl describe ingress shop\ncurl http://shop.cloudline.test/'],
 ['Configuration','ConfigMaps and Secrets','ConfigMaps hold ordinary configuration. Secrets hold references to sensitive values; base64 is representation, not encryption. Use only training-token here. Environment variables are captured at container start: updating the source needs new containers. Mounted configuration refresh is outside this engine.','kubectl apply -f config.yaml\nkubectl rollout restart deployment/web\nkubectl exec POD -- printenv APP_MODE'],
 ['Health','Readiness, liveness and startup','A failed readiness probe makes a Pod ineligible for normal Service traffic, while its container may keep running. A failed liveness probe restarts a container within the same Pod. Startup probes protect slow initialization in real Kubernetes; only HTTP readiness/liveness checks are simulated. Supported app paths are /ready and /healthz on port 80.','kubectl get pods\nkubectl describe pod NAME\nkubectl logs NAME'],
 ['Delivery','Rolling updates and deliberate rollback','Pod-template changes create a new revision; replica scaling alone does not. The supplied rollout budget uses maxSurge: 1 and maxUnavailable: 0. New capacity becomes Ready before old Ready capacity is removed. A stalled rollout reports failure and does not automatically roll back.','kubectl set image deployment/web app=cloudline:v2\nkubectl rollout status deployment/web\nkubectl rollout history deployment/web\nkubectl rollout undo deployment/web'],
 ['Storage','PVC, PV and emptyDir','A PVC requests a volume with a size, class and access mode. The supplied orders-disk PV has 2Gi and class supplied. This lesson models static binding with ReadWriteOnce. Pod deletion keeps PV data, while emptyDir data disappears with the Pod. Volume provisioning, resizing, claims deletion and production CSI details are not simulated.','kubectl apply -f storage.yaml\nkubectl get pv\nkubectl get pvc\nkubectl exec POD -- cat /data/orders.txt'],
 ['Tasks','Jobs and CronJobs','A Job creates a task Pod and records successful completion. Use maintenance:v1 for the supplied one-off task. A CronJob creates Jobs on a schedule in real Kubernetes; CronJob scheduling, parallel jobs and arbitrary batch programs are outside this simulation.','kubectl apply -f job.yaml\nkubectl get jobs\nkubectl describe job archive'],
 ['Scheduling','Requests, limits and Pending Pods','The scheduler compares requests with allocatable teaching capacity: each worker has 2000m CPU and 4Gi. CPU limits bound execution rather than scheduling placement. Here memory limits below the simulated 64Mi working set cause OOMKilled. CPU throttling is explained conceptually. A request cannot exceed its limit.','kubectl get nodes\nkubectl get pods -o wide\nkubectl describe pod NAME'],
 ['Scheduling','Node selectors, taints and tolerations','nodeSelector requires matching labels. worker-c has pool=gpu and dedicated=vip:NoSchedule. A matching toleration permits this node; it does not force placement. NoSchedule affects new placement, not existing Pods. This model chooses the least populated eligible worker, breaking ties by name.','kubectl taint nodes worker-c dedicated=vip:NoSchedule\nkubectl taint nodes worker-c dedicated-'],
 ['Autoscaling','CPU metrics and HPA','CPU utilization is usage divided by CPU requests. This game divides total teaching demand across Ready replicas. The recommendation is ceil(total demand / (per-Pod CPU request × target fraction)), bounded by min/max, with a 10% tolerance. Metrics and requests must exist. HPA scales Pods through a Deployment; it does not add workers. Production stabilization windows are simplified.','kubectl top pods\nkubectl autoscale deployment web --min=2 --max=6 --cpu-percent=60\nkubectl get hpa'],
 ['Maintenance','Cordon, drain and recovery','Cordon prevents new placement while leaving existing Pods running. Drain evicts managed Pods; owners create new ones elsewhere. Unmanaged Pods block drain here. Real drain may need flags, disruption budgets and eviction retries; those policies are outside this prepared lab. Graceful termination is compressed into one teaching event.','kubectl cordon worker-a\nkubectl drain worker-a\nkubectl uncordon worker-a'],
 ['Troubleshooting','Read the failure reason','FailedScheduling: no eligible worker or requested capacity. PendingStorage: the PVC is unbound. ImagePullBackOff: the teaching image is unavailable. CreateContainerConfigError: a referenced key is missing. CrashLoopBackOff: the app or liveness check keeps failing. OOMKilled: the container exceeded its memory limit. Running 0/1: check readiness.','kubectl describe pod NAME\nkubectl logs NAME\nkubectl get endpointslices'],
 ['Practice engine','Supported operations and boundaries','Use local YAML files with apply -f; URL manifests, pipes, command substitutions, arbitrary shell programs and real network calls are not supported. exec supports curl, printenv, and cat /data/orders.txt. get supports -n, -A, -l, --show-labels, and -o wide/yaml/json. Maximum 12 replicas and one app container per Pod keep diagrams readable.','help\nls\ncat web.yaml\nclear\nhint'],
 ['Manifest example','A resilient web Deployment','Match selector labels and Pod-template labels. Edit image, replicas, resources, and HTTP probes to experiment with desired state.',K.yaml.dump(K.deployment())],
 ['Manifest example','Service selector and ports','port belongs to the Service; targetPort is the application listening port. Declaring containerPort documents a port, but does not make an application listen there.',K.yaml.dump(K.service())],
 ['Manifest example','Ingress route','The supplied cloudline controller implements this host and Prefix path route.',K.yaml.dump(K.ingress())]
];
function guideItems(q=''){q=q.toLowerCase();const matches=guides.filter(g=>g.join(' ').toLowerCase().includes(q));return matches.length?matches.map(([tag,title,body,cmd])=>'<article class="panel guide-item"><p class="eyebrow">'+tag+'</p><h3>'+title+'</h3><p>'+body+'</p><pre>'+esc(cmd)+'</pre></article>').join(''):'<p class="muted">No matching entries. Try “Pending”, “Service”, or “rollout”.</p>';}
function guidePage(){return '<div class="guide-head"><p class="eyebrow">Keep the why beside the how</p><h1 style="margin-top:9px">Your field guide.</h1><p>Commands, concepts, failures, and manifests. Everything you need is included offline.</p><label class="sr" for="guide-search">Search the field guide</label><input class="search" id="guide-search" placeholder="Search a concept, command, or failure…" type="search"></div><div class="guide-grid" id="guide-results">'+guideItems()+'</div><p class="muted" style="font-size:11px;margin-top:22px">For practice on a real cluster, see the <a href="https://kubernetes.io/docs/home/" target="_blank" rel="noopener">official Kubernetes documentation ↗</a>. This optional link needs internet.</p>';}
function achievementsPage(){return '<section class="panel achievement-hero"><p class="eyebrow">Your operator record</p><h1 style="margin-top:9px">'+rank()+'.</h1><p>'+game.completed.length+' incidents restored. '+xp()+' XP earned. Each fix built another piece of your Kubernetes understanding.</p><button class="button" data-nav="map">Return to the expedition '+icon('arrow')+'</button></section><div class="achievement-grid">'+K.regions.map((r,i)=>'<section class="panel achievement '+(game.completed.length>=(i+1)*5?'':'locked')+'" style="--region:'+r.color+'">'+icon('award')+'<h3>'+r.badge+'</h3><small>'+r.name+' · '+game.completed.filter(id=>K.missions[id-1].region===i).length+'/5 restored</small>'+(game.completed.length>=(i+1)*5?'<button class="text-button" data-recap="'+i+'">Review what you learned ↗</button>':'')+'</section>').join('')+'</div>';}
function settingsPage(){return '<div class="guide-head"><p class="eyebrow">A game that travels with you</p><h1 style="margin-top:9px">Make it yours.</h1></div><div class="settings">'+[['A complete offline copy','Download one HTML file and open it in a modern browser without internet. Your progress is transferred separately.','download','Download offline game'],['Save your expedition','Export progress, current labs, editor contents, and preferences as JSON. Hosted and downloaded games have separate browser saves.','export','Export progress'],['Bring your progress along','Import a KubeQuest JSON backup. Validated imports replace this browser’s expedition.','import','Import progress'],['Reduced motion','Use static workflow highlights and immediate navigation. Pause and step controls remain available.','motion',game.prefs.reduced?'Reduced motion: on':'Reduced motion: off'],['Start a fresh expedition','Reset XP, hints, campaign labs and sandbox in this browser. Export first if you want a backup.','new-game','Start over']].map(([title,body,a,b])=>'<section class="panel setting-row"><div><h3>'+title+'</h3><p>'+body+'</p></div><button class="button secondary" data-action="'+a+'">'+b+'</button></section>').join('')+'<p class="muted" style="font-size:11px">Progress stays on this device. No account, telemetry, or real Kubernetes installation is required. Creator: <a href="https://github.com/edmvidanes" target="_blank" rel="noopener">Dale.Vidanes</a>.</p></div>';}
function render(){document.documentElement.style.scrollBehavior=game.prefs.reduced?'auto':'smooth';$('app').innerHTML=base(game.view==='map'?mapPage():game.view==='lab'||game.view==='sandbox'?labPage():game.view==='guide'?guidePage():game.view==='achievements'?achievementsPage():settingsPage());if(['lab','sandbox'].includes(game.view)){if($('speed'))$('speed').value=String(game.prefs.speed);updateLog();updateEditor();}}
function updateLog(){const log=$('terminal-log');if(!log)return;log.innerHTML=entries().length?entries().map(e=>'<div class="terminal-entry '+(e.output.startsWith('Error:')?'error':'')+'"><strong>operator $ '+esc(e.command)+'</strong>'+esc(e.output)+'</div>').join(''):'<div class="terminal-entry">Cloudline practice engine · no real commands or network calls.<br>Inspect first: <span style="color:var(--teal)">kubectl get pods</span><br>Use ↑ / ↓ for history, Tab for suggestions, or type help.</div>';log.scrollTop=log.scrollHeight;if($('command-form'))$('command-form').setAttribute('data-feedback',entries().at(-1)?.output.split('\n')[0]||'Command dock · watch the cluster while you work. Scroll to Terminal for full output.');}
function updateEditor(){const select=$('file-select');if(!select)return;const names=Object.keys(engine.state.files);if(!names.includes(editorFile))editorFile=names[0]||'';select.innerHTML=names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('');select.value=editorFile;$('manifest-editor').value=engine.state.files[editorFile]||'# Create a new workspace file to begin.';$('manifest-editor').disabled=!editorFile;}
function award(){if(!currentId())return false;if(engine.objectives().every(o=>o.done)&&!game.completed.includes(currentId())){if(currentId()!==game.completed.length+1)return false;game.completed.push(currentId());toast('Incident restored · +'+currentMission().xp+' XP'+(currentId()%5===0?' · District credential earned':''));return true;}return false;}
function update(){const focused=document.activeElement,focusUID=focused?.dataset?.resource;engine.summarize();award();if($('diagram')){$('diagram').innerHTML=diagram();$('story').innerHTML=story();$('inspector').innerHTML=inspector();if(currentId())$('targets').innerHTML=targets();$('completion').innerHTML=completion();$('xp-count').textContent='✦ '+xp()+' XP';const badge=document.querySelector('.badge-mini');if(badge)badge.textContent=rank();const rankBox=document.querySelector('.rank-box');if(rankBox)rankBox.innerHTML='<p class="eyebrow">Your operator record</p><strong>'+rank()+'</strong><div class="progress"><i style="width:'+game.completed.length/20*100+'%"></i></div><small class="dim">'+game.completed.length+' / 20 incidents restored</small>';if(focusUID){const replacement=[...document.querySelectorAll('[data-resource]')].find(el=>el.dataset.resource===focusUID);if(replacement)replacement.focus({preventScroll:true});}}save();}
function navigate(view){save();if(view==='sandbox'&&currentId()!==0)engine=new K.Engine(0,game.labs[0]||null);else if(view==='lab'&&currentId()===0)engine=new K.Engine(game.active,game.labs[game.active]||null);game.view=view;selected=null;lastEvent=null;render();save();window.scrollTo({top:0,behavior:'instant'});}
function selectMission(id){if(!unlocked(id)){toast('Restore the preceding incident to unlock this mission.');return;}save();game.active=id;game.view='lab';engine=new K.Engine(id,game.labs[id]||null);selected=null;lastEvent=null;editorFile='';render();save();window.scrollTo({top:0,behavior:'instant'});}
function step(){if(!['lab','sandbox'].includes(game.view)||$('dialog').open)return;const ev=engine.step();engine.summarize();if(ev){lastEvent=ev;update();}}
function runCommand(command){command=command.trim();if(!command)return;if(command==='clear'){game.transcripts[currentId()]=[];updateLog();save();return;}if(command==='hint'){hint();return;}const output=engine.execute(command);append(command,output);game.history.push(command);if(game.history.length>100)game.history.shift();historyIndex=game.history.length;lastEvent=engine.state.events.at(-1)||lastEvent;update();updateLog();}
function hint(){if(!currentId()){toast('Use the field guide to explore the sandbox.');return;}game.hints[currentId()]=Math.min(3,(game.hints[currentId()]||0)+1);$('hints').innerHTML=hintsHTML();save();toast('A free hint revealed. Your XP reward stays the same.');}
function recap(region=currentMission().region){const r=K.regions[region];dialog('<p class="eyebrow">District '+(region+1)+' · '+r.badge+'</p><h2>'+r.name+'</h2><p>'+r.description+'</p>'+K.missions.filter(m=>m.region===region).map(m=>'<div class="timeline-item"><strong>'+m.title+'</strong>'+esc(m.concept)+'<small style="display:block;margin-top:4px">'+esc(m.debrief)+'</small></div>').join(''));}
function applyEditor(){if(!editorFile){toast('Create a workspace file first.');return;}engine.setFile(editorFile,$('manifest-editor').value);runCommand('kubectl apply -f '+editorFile);}
function fieldTool(index,form){const tool=(currentId()?currentMission().tools:null)?.[index]||[action('Inspect the fleet','kubectl get pods -A'),action('Scale web','kubectl scale deployment web --replicas=$replicas'),action('Change the image','kubectl set image deployment/web app=$image'),action('Test the gateway','curl $url'),action('Configure CPU autoscaling','kubectl autoscale deployment web --min=2 --max=6 --cpu-percent=60')][index];try{if(tool.file){const doc=K.yaml.load(engine.state.files[tool.file]),value=form.elements.value.value;if(tool.special==='volume')doc.spec.template.spec.volumes=[{name:'orders',persistentVolumeClaim:{claimName:value}}];else if(tool.special==='toleration')doc.spec.template.spec.tolerations=[{key:'dedicated',operator:'Equal',value,effect:'NoSchedule'}];else{const parts=tool.path.split('.');let o=doc;for(const p of parts.slice(0,-1))o=o[p];o[parts.at(-1)]=value;}engine.setFile(tool.file,K.yaml.dump(doc));editorFile=tool.file;updateEditor();runCommand('kubectl apply -f '+tool.file);}else{let command=tool.command;for(const el of form.elements)if(el.name)command=command.replaceAll('$'+el.name,el.value);const p=engine.list('Pod').find(p=>p.metadata.owner&&engine.ready(p));command=command.replaceAll('$pod',p?.metadata.name||'missing-pod');runCommand(command);}}catch(e){toast('Cannot apply guided edit: '+e.message);}}
function setTab(tab){consoleTab=tab;for(const t of ['terminal','manifests']){$(t+'-panel').hidden=t!==tab;$(t+'-tab').classList.toggle('active',t===tab);$(t+'-tab').setAttribute('aria-selected',String(t===tab));}}
$('app').addEventListener('submit',ev=>{ev.preventDefault();if(ev.target.id==='command-form'){runCommand($('command-input').value);$('command-input').value='';$('command-input').focus();}else if(ev.target.matches('[data-tool]'))fieldTool(Number(ev.target.dataset.tool),ev.target);});
$('app').addEventListener('click',ev=>{const el=ev.target.closest('button,a');if(!el)return;if(el.dataset.nav){ev.preventDefault();navigate(el.dataset.nav);return;}if(el.dataset.mission){selectMission(Number(el.dataset.mission));return;}if(el.dataset.region){$('district-'+el.dataset.region).scrollIntoView({behavior:game.prefs.reduced?'instant':'smooth',block:'center'});return;}if(el.dataset.recap){recap(Number(el.dataset.recap));return;}if(el.dataset.component){selected=el.dataset.component;$('inspector').innerHTML=inspector();return;}if(el.dataset.resource){selected=el.dataset.resource;const o=engine.state.resources.find(o=>o.metadata.uid===selected);if(o){engine.inspect(o);lastEvent=engine.state.events.at(-1);}update();return;}if(el.dataset.tab){setTab(el.dataset.tab);return;}switch(el.dataset.action){case 'auto':game.prefs.auto=!game.prefs.auto;el.innerHTML=icon(game.prefs.auto?'pause':'play')+(game.prefs.auto?'Pause':'Play');save();break;case 'step':game.prefs.auto=false;$('auto-button').innerHTML=icon('play')+'Play';step();save();break;case 'hint':hint();break;case 'recap':recap();break;case 'replay':dialog('<p class="eyebrow">Read-only workflow replay</p><h2>How the cluster responded.</h2><p>The live cluster is paused while you review. Replay never executes a command or restores an older state.</p>'+(engine.state.events.length?engine.state.events.slice(-35).map(e=>'<div class="timeline-item"><strong>'+esc(e.actor)+' <small>step '+e.tick+'</small></strong>'+esc(e.message)+'</div>').join(''):'<p>No actions yet. Inspect a resource or submit a change to begin the story.</p>'));break;case 'reset':dialog('<h2>Reset this lab?</h2><p>Restore the prepared cluster and clear its terminal history. Your earned XP and credentials stay saved.</p><button class="button" id="confirm-reset">Reset this lab</button>');break;case 'download':download(offlineSource,'KubeQuest-Offline.html','text/html;charset=utf-8');toast('Complete offline HTML downloaded. Export progress separately to transfer your save.');break;case 'export':save();download(JSON.stringify(game,null,2),'kubequest-progress.json','application/json');break;case 'import':$('import-file').click();break;case 'motion':game.prefs.reduced=!game.prefs.reduced;render();save();break;case 'new-game':dialog('<h2>Start a fresh expedition?</h2><p>This resets this browser’s campaign and sandbox. Export progress in Settings first if you want to keep a backup.</p><button class="button" id="confirm-new">Start over</button>');break;case 'apply-editor':applyEditor();break;case 'new-file':dialog('<h2>A new manifest</h2><p>Choose a local YAML filename. Use the field guide’s examples as a starting point.</p><form id="new-file-form"><label for="new-name">Filename</label><input id="new-name" value="experiment.yaml" pattern="[a-zA-Z0-9_.-]+\.ya?ml" required style="display:block;width:100%;margin:12px 0;padding:10px;background:var(--side);color:var(--text);border:1px solid var(--line)"><button class="button">Create workspace file</button></form>');break;case 'metrics':engine.state.metrics=!engine.state.metrics;el.textContent=(engine.state.metrics?'Disable':'Enable')+' metrics provider';update();break;}});
$('app').addEventListener('input',ev=>{if(ev.target.id==='guide-search')$('guide-results').innerHTML=guideItems(ev.target.value);if(ev.target.id==='manifest-editor'&&editorFile){try{engine.setFile(editorFile,ev.target.value);save();}catch(e){toast(e.message);}}if(ev.target.id==='load-input'){engine.state.load=Number(ev.target.value);$('load-label').textContent=ev.target.value+'m';save();}});
$('app').addEventListener('change',ev=>{if(ev.target.id==='speed'){game.prefs.speed=Number(ev.target.value);save();}if(ev.target.id==='file-select'){editorFile=ev.target.value;updateEditor();}});
$('app').addEventListener('keydown',ev=>{if(ev.target.id==='manifest-editor'&&ev.ctrlKey&&ev.key==='Enter'){ev.preventDefault();applyEditor();}if(ev.target.id==='command-input'){if(ev.key==='ArrowUp'||ev.key==='ArrowDown'){ev.preventDefault();historyIndex=Math.max(0,Math.min(game.history.length,historyIndex+(ev.key==='ArrowUp'?-1:1)));ev.target.value=game.history[historyIndex]||'';}if(ev.key==='Tab'&&!ev.shiftKey){const choices=['kubectl get pods','kubectl get nodes','kubectl get services','kubectl get rs','kubectl describe pod ','kubectl rollout status deployment/web','kubectl rollout history deployment/web','kubectl rollout undo deployment/web','kubectl rollout restart deployment/web','kubectl scale deployment web --replicas=','kubectl set image deployment/web app=','kubectl get pods -A','kubectl get endpointslices','help','hint',...Object.keys(engine.state.files).map(n=>'kubectl apply -f '+n)].filter(s=>s.startsWith(ev.target.value));if(choices.length){ev.preventDefault();if(choices.length===1)ev.target.value=choices[0];else toast(choices.slice(0,4).join(' · '));}}}if(ev.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight'].includes(ev.key)){ev.preventDefault();setTab(consoleTab==='terminal'?'manifests':'terminal');$(consoleTab+'-tab').focus();}});
$('close-dialog').addEventListener('click',()=>$('dialog').close());
$('dialog').addEventListener('click',ev=>{if(ev.target.id==='confirm-reset'){$('dialog').close();engine=new K.Engine(currentId());game.transcripts[currentId()]=[];selected=null;lastEvent=null;render();save();toast('Prepared cluster restored. Your earned rewards are safe.');}if(ev.target.id==='confirm-new'){$('dialog').close();game=fresh();engine=new K.Engine(1);selected=null;lastEvent=null;render();save();toast('A fresh cloud expedition is ready.');}});
$('dialog').addEventListener('submit',ev=>{if(ev.target.id==='new-file-form'){ev.preventDefault();try{const name=$('new-name').value;engine.setFile(name,'# New desired state\n'+K.yaml.dump(K.deployment('experiment')));editorFile=name;$('dialog').close();updateEditor();save();}catch(e){toast(e.message);}}});
$('import-file').addEventListener('change',async ev=>{const file=ev.target.files[0];if(!file)return;try{if(file.size>8000000)throw Error('Progress file is too large.');const imported=validateSave(JSON.parse(await file.text()));game=imported;engine=new K.Engine(game.view==='sandbox'?0:game.active,game.labs[game.view==='sandbox'?0:game.active]||null);selected=null;lastEvent=null;render();save();toast('Progress imported. Welcome back to the cloud.');}catch(e){toast('Import failed: '+e.message);}ev.target.value='';});
window.addEventListener('beforeunload',save);
let elapsed=0;setInterval(()=>{if(!game.prefs.auto||!['lab','sandbox'].includes(game.view)||$('dialog').open){elapsed=0;return;}elapsed+=100;if(elapsed>=game.prefs.speed){elapsed=0;step();}},100);
window.KubeQuest={get engine(){return engine;},get progress(){return K.clone(game);},selectMission,step,validateSave,runCommand};
render();save();
})();
</script>
